<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Byungjin Choi — lunalism</title>
  <desc id="desc">IT Infrastructure, Product Engineering, and iOS</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.48" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef6ff"/>
    </linearGradient>
    <radialGradient id="planet" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#7db8ff" stop-opacity=".92"/>
      <stop offset=".58" stop-color="#6aa8f7" stop-opacity=".72"/>
      <stop offset="1" stop-color="#4285e8" stop-opacity=".16"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".96"/>
      <stop offset=".58" stop-color="#a9d0ff" stop-opacity=".82"/>
      <stop offset="1" stop-color="#377de0" stop-opacity=".35"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="1198" height="318" rx="28" fill="url(#bg)" stroke="#d8e5f3"/>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
    <text x="54" y="72" font-size="15" font-weight="700" letter-spacing="7" fill="#4d8fe8">LUNALISM</text>
    <text x="54" y="132" font-size="48" font-weight="760" fill="#101828">Byungjin Choi</text>
    <text x="54" y="171" font-size="20" font-weight="620" fill="#26364a">IT Infrastructure · Product Engineering · iOS</text>
    <text x="54" y="211" font-size="17" fill="#627086">Build useful things. Keep the complexity underneath.</text>

    <rect x="54" y="244" width="184" height="38" rx="10" fill="#e9f3ff"/>
    <text x="75" y="269" font-size="13" font-weight="750" letter-spacing=".7" fill="#2878dc">BUILD · LEARN · SHARE</text>
  </g>

  <circle cx="926" cy="162" r="94" fill="#7db8ff" opacity=".16" filter="url(#glow)"/>
  <circle cx="926" cy="162" r="79" fill="url(#planet)"/>
  <ellipse cx="926" cy="162" rx="146" ry="48" fill="none" stroke="url(#ring)" stroke-width="3" transform="rotate(-19 926 162)"/>
  <ellipse cx="926" cy="162" rx="123" ry="31" fill="#6faef8" opacity=".18" transform="rotate(-19 926 162)"/>
  <circle cx="926" cy="162" r="6" fill="#3d82de"/>
  <circle cx="781" cy="95" r="2.2" fill="#6eaaf3"/>
  <circle cx="1090" cy="91" r="2.2" fill="#6eaaf3"/>
  <circle cx="1058" cy="241" r="2.2" fill="#6eaaf3"/>
  <circle cx="820" cy="247" r="2.2" fill="#6eaaf3"/>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
    <text x="1084" y="118" font-size="14" font-style="italic" fill="#6c89b8" transform="rotate(-8 1084 118)">Smaller.</text>
    <text x="1084" y="138" font-size="14" font-style="italic" fill="#6c89b8" transform="rotate(-8 1084 138)">Useful.</text>
    <text x="1084" y="158" font-size="14" font-style="italic" fill="#6c89b8" transform="rotate(-8 1084 158)">Brighter.</text>
    <text x="1034" y="271" font-size="10" font-weight="700" letter-spacing="1.3" fill="#7793bc">RELIABLE SYSTEMS</text>
    <text x="1034" y="287" font-size="10" font-weight="700" letter-spacing="1.3" fill="#7793bc">USEFUL PRODUCTS</text>
    <text x="1034" y="303" font-size="10" font-weight="700" letter-spacing="1.3" fill="#7793bc">CONTINUOUS LEARNING</text>
  </g>
</svg>